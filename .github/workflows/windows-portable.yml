name: Build Windows portable ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'START_PORTABLE_WINDOWS.bat'
      - '.github/workflows/windows-portable.yml'
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/TheSpecialOne/runtime/Lib/site-packages | Out-Null
          Copy-Item backend,frontend,scripts,START_PORTABLE_WINDOWS.bat dist/TheSpecialOne -Recurse
          curl.exe -fL --retry 3 -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Python download failed' }
          Expand-Archive python-embed.zip -DestinationPath dist/TheSpecialOne/runtime
          @('python311.zip', '.', 'Lib/site-packages', '..', 'import site') | Set-Content dist/TheSpecialOne/runtime/python311._pth
          python -m pip install --disable-pip-version-check --target dist/TheSpecialOne/runtime/Lib/site-packages -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency packaging failed' }
      - name: Bundle standalone Ollama engine
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/ollama/ollama/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -eq 'ollama-windows-amd64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Standalone Ollama Windows archive not found' }
          New-Item -ItemType Directory -Force dist/TheSpecialOne/ai-engine | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile ollama-windows.zip
          Expand-Archive ollama-windows.zip -DestinationPath dist/TheSpecialOne/ai-engine
          if (-not (Test-Path dist/TheSpecialOne/ai-engine/ollama.exe)) { throw 'Ollama binary missing' }
      - name: Download compact offline AI model
        shell: pwsh
        run: |
          Push-Location dist/TheSpecialOne
          $env:OLLAMA_MODELS = (Join-Path (Get-Location) 'ai-models')
          $env:OLLAMA_HOST = '127.0.0.1:11434'
          New-Item -ItemType Directory -Force $env:OLLAMA_MODELS | Out-Null
          $ollama = Join-Path (Get-Location) 'ai-engine/ollama.exe'
          $server = Start-Process -FilePath $ollama -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ready) { throw 'Ollama did not start on the build runner' }
            & $ollama pull qwen3-vl:4b
            if ($LASTEXITCODE -ne 0) { throw 'Model download failed' }
            $tags = Invoke-RestMethod 'http://127.0.0.1:11434/api/tags'
            if (-not (@($tags.models | ForEach-Object { $_.name }) -contains 'qwen3-vl:4b')) {
              throw 'Model not available after download'
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            Pop-Location
          }
      - name: Smoke-test embedded runtime
        shell: pwsh
        run: |
          Push-Location dist/TheSpecialOne
          ./runtime/python.exe -c "import fastapi,uvicorn,pypdf,fitz,multipart,pwdlib; from backend.app import app; print(app.title)"
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime smoke test failed' }
          Pop-Location
      - name: Package offline Windows bundle in 1.5 GB parts
        shell: pwsh
        run: |
          7z a -t7z -mx=1 -v1500m TheSpecialOne-Windows-x64-Portable.7z dist/TheSpecialOne
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive packaging failed' }
          $parts = @(Get-ChildItem 'TheSpecialOne-Windows-x64-Portable.7z.*')
          if ($parts.Count -eq 0) { throw 'No archive parts produced' }
          Write-Host ('Archive parts: ' + $parts.Count)
      - uses: actions/upload-artifact@v4
        with:
          name: TheSpecialOne-Windows-x64-Portable
          path: TheSpecialOne-Windows-x64-Portable.7z.*
          retention-days: 30
