name: Build Windows Standard (No AI)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - 'scripts/Test-Standard.ps1'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/Start-Standard.ps1'
      - 'START_STANDARD_WINDOWS.bat'
      - '.github/workflows/windows-standard.yml'
permissions:
  contents: write
jobs:
  standard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Validate Python and browser JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q backend scripts
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }
          Get-ChildItem frontend -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax validation failed: $($_.Name)" }
          }
      - name: Bundle Python and dependencies without AI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TheSpecialOneStandard/runtime/Lib/site-packages | Out-Null
          Copy-Item backend,frontend,scripts,samples,START_STANDARD_WINDOWS.bat dist/TheSpecialOneStandard -Recurse
          curl.exe -fL --retry 3 -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Python download failed' }
          Expand-Archive python-embed.zip -DestinationPath dist/TheSpecialOneStandard/runtime
          @('python311.zip', '.', 'Lib/site-packages', '..', 'import site') | Set-Content dist/TheSpecialOneStandard/runtime/python311._pth
          python -m pip install --disable-pip-version-check --target dist/TheSpecialOneStandard/runtime/Lib/site-packages -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency packaging failed' }
          Push-Location dist/TheSpecialOneStandard
          ./runtime/python.exe -c "from backend.standard_app import app; print(app.title)"
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime failed' }
          Pop-Location
      - name: Generate bundled PDF curriculum example
        shell: pwsh
        run: |
          Push-Location dist/TheSpecialOneStandard
          ./runtime/python.exe scripts/make_sample_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'Sample PDF generation failed' }
          ./runtime/python.exe -c "import json; from pathlib import Path; from backend.standard_import import validate_bank; p=Path('samples/primary3-example-bank.json'); rows=validate_bank(json.loads(p.read_text(encoding='utf-8'))); assert len(rows)==20; pdf=Path('samples/THE_SPECIAL_ONE_Sample_Questions.pdf'); assert pdf.read_bytes().startswith(b'%PDF-1.4'); print('Sample JSON and PDF verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled samples validation failed' }
          Pop-Location
      - name: Test complete Standard exam workflow
        shell: pwsh
        run: |
          Push-Location dist/TheSpecialOneStandard
          ./scripts/Test-Standard.ps1
          Pop-Location
      - name: Package Standard ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/TheSpecialOneStandard -DestinationPath TheSpecialOne-Standard-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TheSpecialOne-Standard-Windows-x64
          path: TheSpecialOne-Standard-Windows-x64.zip
          retention-days: 30
      - name: Publish verified Windows ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "standard-v0.1.0-build-${{ github.run_number }}"
          gh release create $tag TheSpecialOne-Standard-Windows-x64.zip --title "THE SPECIAL ONE Standard $tag" --notes "Offline Windows x64 Standard edition. Port 200. No AI model required. Extract ZIP and run START_STANDARD_WINDOWS.bat." --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
